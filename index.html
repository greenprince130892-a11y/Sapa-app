<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sapa</title>
<style>
:root{--bg:#F2F5F4;--sf:#FFFFFF;--ink:#14262B;--mute:#5C6E73;--line:#D9E2E0;--brand:#0B6E77;--on:#FFFFFF;--ok:#16A34A}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif}
#app{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.top{padding:14px 18px 8px;display:flex;justify-content:space-between;align-items:center}
.top h1{margin:0;font-size:24px}.top p{margin:2px 0 0;color:var(--mute);font-size:13px}
.body{flex:1;overflow-y:auto;padding:4px 14px 14px}
.row{display:flex;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0;width:100%;text-align:left}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.meta{flex:1;min-width:0}.meta b{display:block}.meta span{display:block;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wave{background:#E6F2F3;color:var(--brand);border:0;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700}
.pill{background:var(--brand);color:var(--on);border:0;border-radius:99px;padding:9px 16px;font-weight:700}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--sf)}
.tabs button{flex:1;border:0;background:none;padding:10px 0;color:var(--mute);font-weight:600;font-size:12px}
.tabs button[aria-current="true"]{color:var(--brand)}
.note,.empty{text-align:center;color:var(--mute);padding:20px;font-size:14px}
.chat-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sf);border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.b{max-width:78%;padding:9px 13px;border-radius:18px;font-size:15px}
.me{align-self:flex-end;background:var(--brand);color:var(--on)}
.th{align-self:flex-start;background:var(--sf);border:1px solid var(--line)}
.send{display:flex;gap:8px;padding:10px;background:var(--sf);border-top:1px solid var(--line)}
.send input{flex:1;border:1px solid var(--line);border-radius:99px;padding:10px 14px}
.form{padding:24px 20px;display:flex;flex-direction:column;gap:12px;justify-content:center;flex:1}
.form h1{font-size:36px;margin:0}
.form input,.form textarea{border:1px solid var(--line);background:var(--sf);border-radius:12px;padding:12px;width:100%}
.otp{font-size:24px;letter-spacing:6px;text-align:center;font-weight:700}
.big{background:var(--brand);color:var(--on);border:0;border-radius:12px;padding:13px;font-weight:700}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:11px;color:var(--mute)}
</style>
</head>
<body>
<div id="app"><div class="empty">Memuat Sapa…</div></div>
<script src="https://jsdelivr.net"></script>
<script>
var SB_URL="https://supabase.co",SB_KEY="sb_publishable_5bj_O0E3MAcUJp1tuqfBJQ_RTFIAL_X";
var app=document.getElementById("app"),sb=null,me=null,MP=null,P={},BL={},M=[],S={tab:"near",open:null,err:"",step:"email",email:""};
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function hue(s){var h=0;for(var i=0;i<String(s).length;i++)h=(h*31+String(s).charCodeAt(i))|0;return Math.abs(h)%360}
function av(n,id){return '<div class="av" style="background:hsl('+hue(id)+' 45% 38%)">'+esc((n||"?")[0].toUpperCase())+'</div>'}
function other(x){return x.sender===me.id?x.recipient:x.sender}
async function boot(){
  sb=supabase.createClient(SB_URL,SB_KEY);
  var r=await sb.auth.getSession();
  if(r.data.session){me=r.data.session.user;await load()}else render();
}
async function load(){
  var a=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();MP=a.data;
  if(MP){sb.from("profiles").update({seen:new Date().toISOString()}).eq("id",me.id).then(function(){});await refresh();
  sb.channel("pesan").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},function(e){if(!M.some(function(y){return y.id===e.new.id})){M.push(e.new);render()}}).subscribe()}
  render();
}
async function refresh(){
  var r=await Promise.all([sb.from("profiles").select("*").limit(200),sb.from("blocks").select("blocked"),sb.from("messages").select("*").order("created",{ascending:false}).limit(500)]);
  P={};(r[0].data||[]).forEach(function(x){P[x.id]=x});BL={};(r[1].data||[]).forEach(function(x){BL[x.blocked]=1});M=(r[2].data||[]).reverse();
}
function render(){
  if(!me)return login();if(!MP)return onboarding();if(S.open)return chat();
  var h='<div class="top"><div><h1>'+(S.tab==="near"?"Sekitar Anda":S.tab==="chats"?"Obrolan":"Profil Saya")+'</h1></div></div><div class="body">';
  if(S.err)h+='<div class="note">'+esc(S.err)+'</div>';
  if(S.tab==="near"){
    var ids=Object.keys(P).filter(function(k){return k!==me.id&&!BL[k]});
    if(!ids.length)h+='<div class="empty">Belum ada pengguna lain.</div>';
    ids.forEach(function(k){var u=P[k];h+='<div class="row" data-open="'+k+'">'+av(u.name,k)+'<div class="meta"><b>'+esc(u.name)+'</b><span>'+esc(u.bio||"Halo!")+'</span></div><button class="wave" data-wave="'+k+'">👋 Sapa</button></div>'});
  }else if(S.tab==="chats"){
    var seen={},list=[];for(var i=M.length-1;i>=0;i--){var p=other(M[i]);if(!seen[p]&&!BL[p]){seen[p]=1;list.push(M[i])}}
    if(!list.length)h+='<div class="empty">Belum ada obrolan.</div>';
    list.forEach(function(x){var p=other(x),u=P[p]||{name:"Pengguna"};h+='<div class="row" data-open="'+p+'">'+av(u.name,p)+'<div class="meta"><b>'+esc(u.name)+'</b><span>'+esc(x.body)+'</span></div></div>'});
  }else{
    h+='<form id="pf" class="form" style="padding:0"><input name="n" value="'+esc(MP.name)+'" required><textarea name="b" rows="2">'+esc(MP.bio)+'</textarea><button class="big">Simpan Profil</button><button type="button" id="out" class="ghost">Keluar</button></form>';
  }
  h+='</div><nav class="tabs"><button data-tab="near" aria-current="'+(S.tab==="near")+'">📍 Sekitar</button><button data-tab="chats" aria-current="'+(S.tab==="chats")+'">💬 Obrolan</button><button data-tab="me" aria-current="'+(S.tab==="me")+'">👤 Profil</button></nav>';
  app.innerHTML=h;
  app.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){S.tab=b.dataset.tab;S.err="";render()}});
  app.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){S.open=b.dataset.open;render()}});
  app.querySelectorAll("[data-wave]").forEach(function(b){b.onclick=async function(e){e.stopPropagation();S.open=b.dataset.wave;var r=await sb.from("messages").insert({recipient:S.open,body:"Hai! Salam kenal 👋"}).select().single();if(r.data)M.push(r.data);render()}});
  var pf=document.getElementById("pf");
  if(pf){pf.onsubmit=async function(e){e.preventDefault();var r=await sb.from("profiles").update({name:pf.n.value.trim(),bio:pf.b.value.trim()}).eq("id",me.id).select().single();if(r.data){MP=r.data;S.err="Profil disimpan."}render()};document.getElementById("out").onclick=function(){sb.auth.signOut().then(function(){me=null;render()})}}
}
function login(){
  var sent=S.step==="sent";
  app.innerHTML='<form id="lg" class="form"><h1>Sapa</h1><p>'+(sent?'Masukkan kode 6 digit yang dikirim ke '+esc(S.email):'Masuk dengan email. Kami kirim kode 6 digit.')+'</p>'+(S.err?'<div class="note">'+esc(S.err)+'</div>':'')+(sent?'<input name="c" class="otp" maxlength="6" placeholder="000000" required><button class="big">Verifikasi & Masuk</button><button type="button" id="ul" class="ghost">Ganti Email</button>':'<input name="e" type="email" placeholder="nama@email.com" required><button class="big">Kirim Kode</button>')+'</form>';
  var f=document.getElementById("lg");
  if(sent){document.getElementById("ul").onclick=function(){S.step="email";S.err="";login()};f.onsubmit=async function(e){e.preventDefault();var r=await sb.auth.verifyOtp({email:S.email,token:f.c.value.trim(),type:"email"});if(r.error){S.err="Kode salah / kedaluwarsa.";return login()}me=r.data.user;await load()};return}
  f.onsubmit=async function(e){e.preventDefault();var m=f.e.value.trim();var r=await sb.auth.signInWithOtp({email:m});if(r.error){S.err="Gagal kirim: "+r.error.message;return login()}S.email=m;S.step="sent";login()};
}
function onboarding(){
  app.innerHTML='<form id="ob" class="form"><h1>Buat Profil</h1><input name="n" placeholder="Nama panggilan" required><textarea name="b" placeholder="Bio singkat"></textarea><button class="big">Mulai Ngobrol</button></form>';
  document.getElementById("ob").onsubmit=async function(e){e.preventDefault();var f=e.target;var r=await sb.from("profiles").insert({id:me.id,name:f.n.value.trim(),bio:f.b.value.trim(),adult:true}).select().single();if(r.data){MP=r.data;await refresh();render()}};
}
function chat(){
  var id=S.open,u=P[id]||{name:"Pengguna"},m=M.filter(function(x){return other(x)===id});
  var h='<div class="chat-h"><button id="bk" style="border:0;background:none;font-size:20px">←</button><b>'+esc(u.name)+'</b></div><div class="msgs" id="ms">';
  m.forEach(function(x){h+='<div class="b '+(x.sender===me.id?"me":"th")+'">'+esc(x.body)+'</div>'});
  h+='</div><form id="sf" class="send"><input id="mi" placeholder="Tulis pesan…" required><button class="pill">Kirim</button></form>';
  app.innerHTML=h;document.getElementById("ms").scrollTop=99999;
  document.getElementById("bk").onclick=function(){S.open=null;render()};
